function animateWalk(character,time,dt,moving=false,running=false){
 const rig=character.userData.walkRig;if(!rig)return;
 const intensity=moving?1:0,speed=running?13:8.7;
 rig.phase+=dt*speed;
 const swing=Math.sin(rig.phase)*intensity*(running?.75:.53);
 const smooth=Math.min(1,dt*10);
 rig.leftLeg.rotation.x=THREE.MathUtils.lerp(rig.leftLeg.rotation.x,swing,smooth);
 rig.rightLeg.rotation.x=THREE.MathUtils.lerp(rig.rightLeg.rotation.x,-swing,smooth);
 rig.leftArm.rotation.x=THREE.MathUtils.lerp(rig.leftArm.rotation.x,-swing*.75,smooth);
 rig.rightArm.rotation.x=THREE.MathUtils.lerp(rig.rightArm.rotation.x,swing*.75,smooth);
 rig.body.position.y=THREE.MathUtils.lerp(rig.body.position.y,moving?Math.abs(Math.cos(rig.phase))*.055:0,smooth);
 rig.body.rotation.z=THREE.MathUtils.lerp(rig.body.rotation.z,moving?Math.sin(rig.phase)*.035:0,smooth);
}

function fittedInstance(source,width,height,depth){
 const object=source.clone(true);
 const bounds=new THREE.Box3().setFromObject(object), size=bounds.getSize(new THREE.Vector3());
 const scale=Math.min(width/Math.max(size.x,.01),height/Math.max(size.y,.01),depth/Math.max(size.z,.01));
 object.scale.setScalar(scale);
 const adjusted=new THREE.Box3().setFromObject(object);
 const center=adjusted.getCenter(new THREE.Vector3());
 object.position.set(-center.x,-adjusted.min.y,-center.z);
 object.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true}});
 return object;
}

 const canvas=document.querySelector('#sleighCanvas'),ctx=canvas.getContext('2d');let lane=1,lives=3,score=0,objects=[],ticks=0,active=false,remaining=30,last=0,raf=0;
 const move=dir=>{if(active){lane=Math.max(0,Math.min(2,lane+dir));playFx('tap')}};

 const keyHandler=e=>{if(document.querySelector('#sleighCanvas')&&active){if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();move(1)}}};window.addEventListener('keydown',keyHandler,{signal:modalController.signal});
 function render(t){if(!document.querySelector('#sleighCanvas')){cancelAnimationFrame(raf);return}let dt=Math.min((t-last||16)/1000,.05);last=t;ctx.clearRect(0,0,380,190);ctx.fillStyle='#d9f0fa';ctx.fillRect(0,0,380,190);ctx.fillStyle='#f4fff8';for(let j=0;j<3;j++)ctx.fillRect(70+j*94,0,83,190);ctx.fillStyle='#b7d8dd';for(let j=1;j<3;j++)ctx.fillRect(61+j*94,0,3,190);if(active){ticks+=dt;remaining-=dt;if(ticks>.78){ticks=0;objects.push({lane:Math.floor(Math.random()*3),y:-18,gift:Math.random()>.42})}for(let o of objects)o.y+=dt*138;objects=objects.filter(o=>{if(o.y>145){if(o.lane===lane){if(o.gift){score++;playFx('gift')}else{lives--;playFx('skate')}}return false}return o.y<198});if(remaining<=0||lives<=0){active=false;document.querySelector('#sleighStart').disabled=false;document.querySelector('#sleighStart').textContent='🔁 다시 도전';if(score>=12)playFx('success')}}ctx.textAlign='center';ctx.font='28px sans-serif';for(let o of objects)ctx.fillText(o.gift?'🎁':'🌲',111+o.lane*94,o.y);ctx.font='39px sans-serif';ctx.fillText('🛷',111+lane*94,170);document.querySelector('#sleighScore').textContent='🎁 '+score+'개';document.querySelector('#sleighLife').textContent='❤️'.repeat(Math.max(0,lives));document.querySelector('#sleighTime').textContent='⏱ '+Math.ceil(Math.max(0,remaining))+'초';raf=requestAnimationFrame(render)}raf=requestAnimationFrame(render);
 document.querySelector('#sleighStart').onclick=()=>{lane=1;lives=3;score=0;objects=[];remaining=30;active=true;last=performance.now();document.querySelector('#sleighStart').disabled=true;playFx('bell')};return;

if(action==='music'){
 const notes=[523.25,659.25,783.99,1046.5],sequence=[0,1,2,1,3],labels=['도 🔔','미 🔔','솔 🔔','높은 도 🔔'];let step=0;
 frame('캐럴 종 연주','🔔','반짝이는 종을 순서대로 눌러 나만의 겨울 멜로디를 완성하세요. 익숙한 노래가 아닌 이 마을의 오리지널 연주입니다.',`<div class="mini-scene" style="height:115px"><span style="font-size:55px">🎼🔔✨</span><span class="mini-caption" id="musicHint">연주 순서: 도 → 미 → 솔 → 미 → 높은 도</span></div><div class="music-pad">${labels.map((l,i)=>`<button data-note="${i}">${l}</button>`).join('')}</div><div class="game-info"><span id="musicStep">0 / 5단계</span><span id="musicStatus">🎶 종을 눌러보세요</span></div><button class="submit" id="musicReset">처음부터 다시 연주</button>`);

if(action==='fire'){frame('벽난로 쉼터','🔥','잠시 쉬어가도 괜찮아요. 이곳에서는 아무것도 하지 않아도 됩니다.',`<div class="fireplace-art"><span>🪵</span><strong>🔥</strong><span>🪵</span></div><p style="text-align:center;font-size:15px;color:#725a4b">“차가운 겨울에도<br>당신의 하루는 따뜻할 자격이 있어요.”</p><button class="submit" id="warmBtn">따뜻한 한마디 받기</button><div id="warmWord" style="margin-top:12px;text-align:center;color:#915b4c;font-size:13px"></div>`);const words=['오늘도 정말 수고 많았어요.','조금 느리게 걸어도 괜찮아요.','당신 덕분에 누군가는 웃었을 거예요.','올해의 작은 행복들을 떠올려봐요.'];document.querySelector('#warmBtn').onclick=()=>{playFx('fire');document.querySelector('#warmWord').textContent=words[Math.floor(Math.random()*words.length)]};return}}

function openGuide(){frame('마을 이용 방법','❄️','크리스마스 마을에서 나만의 속도로 쉬고 놀아보세요.',`<div class="guide-list"><div><b>① 마을 입장 · 이동</b><p>WASD 또는 방향키로 걷고, Shift를 누르면 빠르게 걸어요. 모바일에서는 화면의 방향키를 사용하세요.</p></div><div><b>② 활동 체험</b><p>하단에서 광장 · 소원 · 방울 · 트리를 선택하세요. 건물 근처에서는 E 키로 체험할 수 있어요. 🧑‍🎄에서 의상과 얼굴도 꾸밀 수 있어요.</p></div><div><b>③ 소리 조절</b><p>우측 상단 🎚️에서 환경음·캐럴·효과음을 각각 켜거나 음량을 바꿀 수 있어요.</p></div><div><b>④ 다른 공간 방문</b><p>상단 🎁에서 직접 그리는 쿠키·눈사람·3D 스키·캐릭터 꾸미기 등 다양한 체험을 찾을 수 있어요.</p></div><div><b>⑤ 소원 공유</b><p>소원은 공개 게시판에 남습니다. 본인이나 다른 사람의 개인정보는 작성하지 마세요.</p></div></div>`)}
function openMore(){const options=[['tree','🎄 트리 꾸미기'],['avatar','🧑‍🎄 캐릭터 꾸미기'],['lodge','🏠 크리스마스 홀'],['snowman','☃️ 눈사람 만들기'],['ski3d','⛷️ 3D 스키 코스'],['delivery','🎅 선물 배달'],['letter','💌 산타 우체국'],['gift','🎁 선물 찾기'],['fire','🔥 벽난로 쉼터'],['cookie','🍪 진저브레드 공방'],['skate','⛸️ 스케이트장'],['photo','📷 포토존'],['snowball','☃️ 눈싸움'],['sleigh','🛷 썰매 배송'],['market','🛍️ 겨울 마켓'],['music','🎵 종 연주']];frame('더 많은 체험','🎁','이 마을의 열한 가지 겨울 체험을 마음껏 둘러보세요.',`<div class="more-grid">${options.map(([id,title])=>`<button data-extra="${id}">${title}</button>`).join('')}</div>`);document.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>openAction(b.dataset.extra))}
let bellAutoTimer=null, bellCount=0;
function stopBell(){if(bellAutoTimer){clearInterval(bellAutoTimer);bellAutoTimer=null}}
function ringBell(){if(!audioContext){ensureAudio()}playFx('bell');bellCount++;const el=document.querySelector('#bellCount');if(el)el.textContent=bellCount+'번 울렸어요';const bell=document.querySelector('.huge-bell');if(bell){bell.classList.remove('ringing');void bell.offsetWidth;bell.classList.add('ringing')}}
function openBell(){stopBell();frame('크리스마스 방울','🔔','따뜻한 겨울의 리듬을 느껴보세요. 방울을 직접 누르거나 천천히 자동재생할 수 있어요.',`<div class="activity-stage"><button class="huge-bell" id="ringButton" aria-label="방울 울리기">🔔</button><div id="bellCount">${bellCount}번 울렸어요</div></div><div class="activity-actions"><button id="bellAuto">▶ 자동재생</button><button id="bellStop">■ 멈춤</button></div><p class="activity-tip">방울은 직접 누를 때마다 부드러운 종소리가 납니다. 효과음이 꺼져 있으면 설정에서 켜주세요.</p>`);document.querySelector('#ringButton').onclick=ringBell;document.querySelector('#bellAuto').onclick=()=>{if(bellAutoTimer)return;ringBell();bellAutoTimer=setInterval(()=>{if(!document.querySelector('#ringButton')){stopBell();return}ringBell()},1450);document.querySelector('#bellAuto').textContent='▶ 자동재생 중'};document.querySelector('#bellStop').onclick=()=>{stopBell();document.querySelector('#bellAuto').textContent='▶ 자동재생'}}
function openGarland(){openAction('tree')}
const originalCloseModal=closeModal;
// Keep the automated bell from playing after leaving the activity.
function closeBellSafe(){stopBell();originalCloseModal()}

document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>openAction(el.dataset.action)))
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='e'||e.key==='E')&&!inModal&&!document.querySelector('.welcome')&&nearAction)openAction(nearAction)})
// Original soundscape made with the Web Audio API. No copyrighted recordings.
let audioContext,ambientNodes=[],ambienceTimer=null,footStepEnabled=true,ambLevel=.45,fxLevel=.65,soundMode="snow",carolLevel=.26,carolEnabled=true,ambEnabled=true,fxEnabled=true,carolTimer=null,carolStep=0,bgPlay=false;
function ensureAudio(){if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)()}if(audioContext.state==='suspended')audioContext.resume();return audioContext}

// Original short winter motif, separate from effect sound sliders.
const carolMelody=[392,523.25,659.25,523.25,440,587.33,698.46,587.33,392,523.25,784,659.25,587.33,523.25,440,392];
function carolTone(freq){if(!audioContext||muted||!carolEnabled||carolLevel===0)return;const ctx=audioContext,t=ctx.currentTime,osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,carolLevel*.042),t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.8);osc.connect(g).connect(ctx.destination);osc.start(t);osc.stop(t+.84)}
function startCarol(){if(carolTimer)return;carolTimer=setInterval(()=>{if(document.hidden&&!bgPlay)return;carolTone(carolMelody[carolStep%carolMelody.length]);carolStep++},780)}
function tone(freq,duration=.4,volume=.05,type='sine',delay=0){if(muted||!audioContext||!fxEnabled)return;const ctx=audioContext,now=ctx.currentTime+delay;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume*fxLevel),now+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(ctx.destination);osc.start(now);osc.stop(now+duration+.03)}
function noiseBurst(duration=.1,volume=.03,filterHz=1300){if(muted||!audioContext||!fxEnabled)return;const ctx=audioContext,n=Math.round(duration*ctx.sampleRate),buf=ctx.createBuffer(1,n,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();buf.copyToChannel(data,0);src.buffer=buf;filter.type='lowpass';filter.frequency.value=filterHz;g.gain.setValueAtTime(volume*fxLevel,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);src.connect(filter).connect(g).connect(ctx.destination);src.start()}
function playFx(kind){if(!audioContext||muted)return;switch(kind){case 'bell':[[784,0],[988,.14],[1175,.3]].forEach(([n,d])=>tone(n,1.3,.048,'sine',d));break;case 'magic':[[523,0],[659,.13],[784,.28],[1046,.45]].forEach(([n,d])=>tone(n,1,.05,'sine',d));break;case 'gift':[[392,0],[523,.14],[659,.28],[784,.42]].forEach(([n,d])=>tone(n,.8,.05,'triangle',d));break;case 'mail':tone(880,.4,.045);tone(1319,.5,.04,'sine',.16);break;case 'fire':noiseBurst(.6,.025,600);break;case 'mix':noiseBurst(.3,.045,2100);break;case 'skate':noiseBurst(.35,.023,3200);break;case 'success':[[523,0],[659,.17],[784,.34],[1046,.51]].forEach(([n,d])=>tone(n,.65,.05,'sine',d));break;case 'open':tone(470,.14,.025);break;default:tone(650,.12,.018)}}
function footstepSound(){if(footStepEnabled&&fxEnabled)noiseBurst(.07,.013,600)}
function startAmbience(){try{ensureAudio();muted=false;document.querySelector('#soundBtn').textContent='🔊';const ctx=audioContext;if(!ambientNodes.length){const length=ctx.sampleRate*3,b=ctx.createBuffer(1,length,ctx.sampleRate),samples=b.getChannelData(0);for(let i=0;i<length;i++)samples[i]=Math.random()*2-1;const wind=ctx.createBufferSource(),low=ctx.createBiquadFilter(),volume=ctx.createGain();wind.buffer=b;wind.loop=true;low.type='lowpass';low.frequency.value=450;volume.gain.value=ambEnabled?.045*ambLevel:0;wind.connect(low).connect(volume).connect(ctx.destination);wind.start();ambientNodes.push(wind,volume)}startCarol();if(!ambienceTimer){ambienceTimer=setInterval(()=>{if(!muted){const d=Math.hypot(player.position.x-16,player.position.z-13);if((!muted&&ambEnabled)&&(soundMode==="fire"||d<12))noiseBurst(.2,.015*ambLevel,650);if((!muted&&ambEnabled)&&(soundMode==="bells"||Math.random()>.82))tone([523,659,784,1046][Math.floor(Math.random()*4)],2,.014*ambLevel,'sine')}},2300)}playFx('bell')}catch(err){console.warn('Sound unavailable',err)}}


const settingsPanel=document.querySelector('#soundPanel');
function setAmb(v){ambLevel=Number(v)/100;document.querySelector('#ambValue').textContent=v+'%';if(audioContext)ambientNodes.filter(n=>n.gain).forEach(n=>n.gain.setTargetAtTime(muted||!ambEnabled?0:.045*ambLevel,audioContext.currentTime,.15))}
function setFx(v){fxLevel=Number(v)/100;document.querySelector('#fxValue').textContent=v+'%'}
function setCarol(v){carolLevel=Number(v)/100;document.querySelector('#carolValue').textContent=v+'%'}

document.querySelector('#ambToggle').onclick=()=>{ambEnabled=!ambEnabled;toggleButton('ambToggle',ambEnabled);setAmb(document.querySelector('#ambSlider').value)};
document.querySelector('#fxToggle').onclick=()=>{fxEnabled=!fxEnabled;toggleButton('fxToggle',fxEnabled);if(fxEnabled&&audioContext)playFx('bell')};
document.querySelector('#carolToggle').onclick=()=>{carolEnabled=!carolEnabled;toggleButton('carolToggle',carolEnabled);if(carolEnabled)startCarol()};
document.querySelector('#speedSlider').oninput=e=>{moveSpeed=Number(e.target.value);document.querySelector('#speedValue').textContent=moveSpeed<9?'산책':moveSpeed<15?'빠르게':moveSpeed<19?'질주':'최고속도'};
document.querySelector('#stepCheck').onchange=e=>{footStepEnabled=e.target.checked};
document.querySelector('#bgPlay').onchange=e=>{bgPlay=e.target.checked};
document.querySelector('#guideBtn').onclick=()=>openGuide();
document.querySelector('#moreBtn').onclick=()=>openMore();
document.querySelector('#guideInSettings').onclick=()=>{settingsPanel.hidden=true;openGuide()};
document.querySelector('#soundBtn').onclick=()=>{if(!audioContext)startAmbience();else{muted=!muted;ambientNodes.filter(n=>n.gain).forEach(n=>n.gain.setTargetAtTime(muted||!ambEnabled?0:.045*ambLevel,audioContext.currentTime,.1));document.querySelector('#soundBtn').textContent=muted?'🔇':'🔊';if(!muted)playFx('bell')}message(muted?'모든 소리를 껐어요':'겨울 마을의 소리가 켜졌어요 🔔')};

animate();
