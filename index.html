function tone(freq,duration=.4,volume=.05,type='sine',delay=0){if(muted||!audioContext||!fxEnabled)return;const ctx=audioContext,now=ctx.currentTime+delay;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume*fxLevel),now+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(ctx.destination);osc.start(now);osc.stop(now+duration+.03)}
function noiseBurst(duration=.1,volume=.03,filterHz=1300){if(muted||!audioContext||!fxEnabled)return;const ctx=audioContext,n=Math.round(duration*ctx.sampleRate),buf=ctx.createBuffer(1,n,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();buf.copyToChannel(data,0);src.buffer=buf;filter.type='lowpass';filter.frequency.value=filterHz;g.gain.setValueAtTime(volume*fxLevel,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);src.connect(filter).connect(g).connect(ctx.destination);src.start()}
function playFx(kind){if(!audioContext||muted)return;switch(kind){case 'bell':[[784,0],[988,.14],[1175,.3]].forEach(([n,d])=>tone(n,1.3,.048,'sine',d));break;case 'magic':[[523,0],[659,.13],[784,.28],[1046,.45]].forEach(([n,d])=>tone(n,1,.05,'sine',d));break;case 'gift':[[392,0],[523,.14],[659,.28],[784,.42]].forEach(([n,d])=>tone(n,.8,.05,'triangle',d));break;case 'mail':tone(880,.4,.045);tone(1319,.5,.04,'sine',.16);break;case 'fire':noiseBurst(.6,.025,600);break;case 'mix':noiseBurst(.3,.045,2100);break;case 'skate':noiseBurst(.35,.023,3200);break;case 'success':[[523,0],[659,.17],[784,.34],[1046,.51]].forEach(([n,d])=>tone(n,.65,.05,'sine',d));break;case 'open':tone(470,.14,.025);break;default:tone(650,.12,.018)}}
function footstepSound(){if(footStepEnabled&&fxEnabled)noiseBurst(.07,.013,600)}
function startAmbience(){try{ensureAudio();muted=false;document.querySelector('#soundBtn').textContent='🔊';const ctx=audioContext;if(!ambientNodes.length){const length=ctx.sampleRate*3,b=ctx.createBuffer(1,length,ctx.sampleRate),samples=b.getChannelData(0);for(let i=0;i<length;i++)samples[i]=Math.random()*2-1;const wind=ctx.createBufferSource(),low=ctx.createBiquadFilter(),volume=ctx.createGain();wind.buffer=b;wind.loop=true;low.type='lowpass';low.frequency.value=450;volume.gain.value=ambEnabled?.045*ambLevel:0;wind.connect(low).connect(volume).connect(ctx.destination);wind.start();ambientNodes.push(wind,volume)}startCarol();if(!ambienceTimer){ambienceTimer=setInterval(()=>{if(!muted){const d=Math.hypot(player.position.x-16,player.position.z-13);if((!muted&&ambEnabled)&&(soundMode==="fire"||d<12))noiseBurst(.2,.015*ambLevel,650);if((!muted&&ambEnabled)&&(soundMode==="bells"||Math.random()>.82))tone([523,659,784,1046][Math.floor(Math.random()*4)],2,.014*ambLevel,'sine')}},2300)}playFx('bell')}catch(err){console.warn('Sound unavailable',err)}}


const settingsPanel=document.querySelector('#soundPanel');
function setAmb(v){ambLevel=Number(v)/100;document.querySelector('#ambValue').textContent=v+'%';if(audioContext)ambientNodes.filter(n=>n.gain).forEach(n=>n.gain.setTargetAtTime(muted||!ambEnabled?0:.045*ambLevel,audioContext.currentTime,.15))}
function setFx(v){fxLevel=Number(v)/100;document.querySelector('#fxValue').textContent=v+'%'}
function setCarol(v){carolLevel=Number(v)/100;document.querySelector('#carolValue').textContent=v+'%'}
function toggleButton(id,enabled){document.querySelector('#'+id).textContent=enabled?'켜짐':'꺼짐';document.querySelector('#'+id).classList.toggle('off',!enabled)}
document.querySelector('#settingsBtn').onclick=()=>{settingsPanel.hidden=!settingsPanel.hidden};
document.querySelector('#closeSettings').onclick=()=>settingsPanel.hidden=true;
document.querySelector('#ambSlider').oninput=e=>setAmb(e.target.value);
document.querySelector('#fxSlider').oninput=e=>setFx(e.target.value);
document.querySelector('#carolSlider').oninput=e=>setCarol(e.target.value);
document.querySelector('#ambToggle').onclick=()=>{ambEnabled=!ambEnabled;toggleButton('ambToggle',ambEnabled);setAmb(document.querySelector('#ambSlider').value)};
document.querySelector('#fxToggle').onclick=()=>{fxEnabled=!fxEnabled;toggleButton('fxToggle',fxEnabled);if(fxEnabled&&audioContext)playFx('bell')};
document.querySelector('#carolToggle').onclick=()=>{carolEnabled=!carolEnabled;toggleButton('carolToggle',carolEnabled);if(carolEnabled)startCarol()};
document.querySelector('#speedSlider').oninput=e=>{moveSpeed=Number(e.target.value);document.querySelector('#speedValue').textContent=moveSpeed<9?'산책':moveSpeed<15?'빠르게':moveSpeed<19?'질주':'최고속도'};
document.querySelector('#stepCheck').onchange=e=>{footStepEnabled=e.target.checked};
document.querySelector('#bgPlay').onchange=e=>{bgPlay=e.target.checked};
document.querySelector('#guideBtn').onclick=()=>openGuide();
document.querySelector('#moreBtn').onclick=()=>openMore();
document.querySelector('#guideInSettings').onclick=()=>{settingsPanel.hidden=true;openGuide()};
document.querySelector('#soundBtn').onclick=()=>{if(!audioContext)startAmbience();else{muted=!muted;ambientNodes.filter(n=>n.gain).forEach(n=>n.gain.setTargetAtTime(muted||!ambEnabled?0:.045*ambLevel,audioContext.currentTime,.1));document.querySelector('#soundBtn').textContent=muted?'🔇':'🔊';if(!muted)playFx('bell')}message(muted?'모든 소리를 껐어요':'겨울 마을의 소리가 켜졌어요 🔔')};
</script></body></html>
