    else if(stage===2){stage=3;document.querySelector('#cookieVisual').textContent='🔥🍪🔥';document.querySelector('#cookieBtn').disabled=true;document.querySelector('#cookieInstruction').textContent='굽는 중...';playFx('fire');let time=3;const t=setInterval(()=>{if(!document.querySelector('#cookieInstruction')){clearInterval(t);return}time--;document.querySelector('#cookieInstruction').textContent=`따끈한 쿠키 굽는 중... ${Math.max(0,time)}초`;if(time<=0){clearInterval(t);stage=4;document.querySelector('#cookieVisual').textContent='🍪✨ '+chosen.join('');document.querySelector('#cookieInstruction').textContent='내가 만든 쿠키가 완성됐어요!';document.querySelector('#cookieBtn').textContent='쿠키 완성 🎉';localStorage.setItem('christmasCookie','true');playFx('success');message('직접 만든 쿠키 완성! 🍪')}} ,1000)};
    document.querySelector('#cookieProgress').textContent=Math.min(stage,4)+' / 4단계'};
  return}
if(action==='skate'){
  let points=0,misses=0,phase=0,started=false;frame('눈꽃 스케이트장','⛸️','움직이는 선이 중앙의 황금 영역에 들어올 때 STOP! 정확하게 멈춰 5점을 모아보세요.',`<div class="mini-scene"><div class="ice-avatar" id="skater">⛸️</div><div class="ice-track"><div class="ice-target"></div><div class="ice-cursor" id="iceCursor"></div></div></div><p style="text-align:center" id="skateScore">점수 0 / 5 · 실패 0회</p><button class="submit" id="skateBtn">시작하기</button>`);
  let last=performance.now();function loop(t){if(!document.querySelector('#iceCursor'))return;if(started){phase+=Math.min((t-last)/1000,.05)*1.35;let v=(Math.sin(phase)+1)/2;document.querySelector('#iceCursor').style.left=(v*100)+'%'}last=t;requestAnimationFrame(loop)}requestAnimationFrame(loop);
  document.querySelector('#skateBtn').onclick=()=>{if(!started){started=true;document.querySelector('#skateBtn').textContent='⛸️ STOP!';playFx('skate');return}started=false;let v=(Math.sin(phase)+1)/2;if(v>.41&&v<.59){points++;playFx('success');document.querySelector('#skater').textContent='⛸️✨'}else{misses++;playFx('tap');document.querySelector('#skater').textContent='⛸️💨'}document.querySelector('#skateScore').textContent=`점수 ${points} / 5 · 실패 ${misses}회`;if(points>=5){document.querySelector('#skateBtn').disabled=true;document.querySelector('#skateBtn').textContent='스케이트 챔피언 🏆';localStorage.setItem('christmasSkate','true');message('스케이트 미션 성공! ⛸️')}else document.querySelector('#skateBtn').textContent='다시 달리기 →'};
  return}
if(action==='photo'){frame('크리스마스 포토존','📸','나만의 크리스마스 기념 카드를 PNG 이미지로 저장하세요.',`<div class="decor">🎅 📸 🎄</div><label for="photoCaption">기념 카드 한마디</label><input id="photoCaption" maxlength="50" placeholder="Merry Christmas!"/><button class="submit" id="photoBtn">사진 만들고 PNG 저장하기</button>`);document.querySelector('#photoBtn').onclick=()=>{const c=document.createElement('canvas');c.width=1080;c.height=1080;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,1080,1080);g.addColorStop(0,'#163f47');g.addColorStop(1,'#567b75');x.fillStyle=g;x.fillRect(0,0,1080,1080);x.fillStyle='#f3d7a0';x.textAlign='center';x.font='72px Georgia';x.fillText('Christmas Village',540,195);x.font='180px sans-serif';x.fillText('🎄',540,530);x.fillStyle='white';x.font='bold 52px sans-serif';x.fillText((nickname||'여행자').slice(0,16),540,680);x.font='36px sans-serif';const text=(document.querySelector('#photoCaption').value.trim()||'Merry Christmas!').slice(0,50);x.fillText(text.slice(0,25),540,770);if(text.length>25)x.fillText(text.slice(25),540,820);x.font='30px Georgia';x.fillText('WINTER 2026',540,940);const a=document.createElement('a');a.download='christmas-village-card.png';a.href=c.toDataURL('image/png');a.click();message('크리스마스 카드를 저장했어요 📸')};return}
if(action==='fire'){frame('벽난로 쉼터','🔥','잠시 쉬어가도 괜찮아요. 이곳에서는 아무것도 하지 않아도 됩니다.',`<div class="fireplace-art"><span>🪵</span><strong>🔥</strong><span>🪵</span></div><p style="text-align:center;font-size:15px;color:#725a4b">“차가운 겨울에도<br>당신의 하루는 따뜻할 자격이 있어요.”</p><button class="submit" id="warmBtn">따뜻한 한마디 받기</button><div id="warmWord" style="margin-top:12px;text-align:center;color:#915b4c;font-size:13px"></div>`);const words=['오늘도 정말 수고 많았어요.','조금 느리게 걸어도 괜찮아요.','당신 덕분에 누군가는 웃었을 거예요.','올해의 작은 행복들을 떠올려봐요.'];document.querySelector('#warmBtn').onclick=()=>{playFx('fire');document.querySelector('#warmWord').textContent=words[Math.floor(Math.random()*words.length)]};return}}
document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>openAction(el.dataset.action)))
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='e'||e.key==='E')&&!inModal&&!document.querySelector('.welcome')&&nearAction)openAction(nearAction)})
// Original soundscape made with the Web Audio API. No copyrighted recordings.
let audioContext,ambientNodes=[],ambienceTimer=null,footStepEnabled=true;
function ensureAudio(){if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)()}if(audioContext.state==='suspended')audioContext.resume();return audioContext}
function tone(freq,duration=.4,volume=.05,type='sine',delay=0){if(muted||!audioContext)return;const ctx=audioContext,now=ctx.currentTime+delay;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(ctx.destination);osc.start(now);osc.stop(now+duration+.03)}
function noiseBurst(duration=.1,volume=.03,filterHz=1300){if(muted||!audioContext)return;const ctx=audioContext,n=Math.round(duration*ctx.sampleRate),buf=ctx.createBuffer(1,n,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();buf.copyToChannel(data,0);src.buffer=buf;filter.type='lowpass';filter.frequency.value=filterHz;g.gain.setValueAtTime(volume,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);src.connect(filter).connect(g).connect(ctx.destination);src.start()}
function playFx(kind){if(!audioContext||muted)return;switch(kind){case 'bell':[[784,0],[988,.14],[1175,.3]].forEach(([n,d])=>tone(n,1.3,.048,'sine',d));break;case 'magic':[[523,0],[659,.13],[784,.28],[1046,.45]].forEach(([n,d])=>tone(n,1,.05,'sine',d));break;case 'gift':[[392,0],[523,.14],[659,.28],[784,.42]].forEach(([n,d])=>tone(n,.8,.05,'triangle',d));break;case 'mail':tone(880,.4,.045);tone(1319,.5,.04,'sine',.16);break;case 'fire':noiseBurst(.6,.025,600);break;case 'mix':noiseBurst(.3,.045,2100);break;case 'skate':noiseBurst(.35,.023,3200);break;case 'success':[[523,0],[659,.17],[784,.34],[1046,.51]].forEach(([n,d])=>tone(n,.65,.05,'sine',d));break;case 'open':tone(470,.14,.025);break;default:tone(650,.12,.018)}}
function footstepSound(){if(footStepEnabled)noiseBurst(.07,.013,600)}
function startAmbience(){try{ensureAudio();muted=false;document.querySelector('#soundBtn').textContent='🔊';const ctx=audioContext;if(!ambientNodes.length){const length=ctx.sampleRate*3,b=ctx.createBuffer(1,length,ctx.sampleRate),samples=b.getChannelData(0);for(let i=0;i<length;i++)samples[i]=Math.random()*2-1;const wind=ctx.createBufferSource(),low=ctx.createBiquadFilter(),volume=ctx.createGain();wind.buffer=b;wind.loop=true;low.type='lowpass';low.frequency.value=450;volume.gain.value=.022;wind.connect(low).connect(volume).connect(ctx.destination);wind.start();ambientNodes.push(wind,volume)}if(!ambienceTimer){ambienceTimer=setInterval(()=>{if(!muted){const d=Math.hypot(player.position.x-16,player.position.z-13);if(d<17)noiseBurst(.2,.016*(1-d/20),750);if(Math.random()>.69)tone([523,659,784,1046][Math.floor(Math.random()*4)],2,.012,'sine')}},2300)}playFx('bell')}catch(err){console.warn('Sound unavailable',err)}}
document.querySelector('#soundBtn').onclick=()=>{if(!audioContext)startAmbience();else{muted=!muted;ambientNodes.filter(n=>n.gain).forEach(n=>n.gain.setTargetAtTime(muted?0:.022,audioContext.currentTime,.1));document.querySelector('#soundBtn').textContent=muted?'🔇':'🔊';if(!muted)playFx('bell')}message(muted?'소리가 꺼졌어요':'겨울 바람과 종소리가 들려요 🔔')}
</script></body></html>
